<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE LOST HORIZON</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bb8ad;font-family:Georgia,serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#f4ead2;text-shadow:0 2px 8px #10201dcc}#brand{position:absolute;top:20px;left:22px;letter-spacing:.2em;font:bold 13px Arial}#brand small{display:block;margin-top:6px;font:10px Arial;letter-spacing:.28em;color:#c5b991}#objective{position:absolute;top:20px;right:22px;text-align:right;font:12px Arial;letter-spacing:.08em}#objective strong{display:block;margin-top:7px;font:17px Georgia;color:#f2dca7}#hint{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);padding:12px 18px;border:1px solid #d8c99b66;background:#14241dcc;border-radius:3px;font:12px Arial;text-align:center;max-width:90vw}#panel{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:26px 30px;border:1px solid #c6ae75;background:#10231fee;text-align:center;max-width:90vw;pointer-events:auto}#panel h1{font-weight:normal;letter-spacing:.15em;font-size:22px}#panel p{font:14px/1.6 Arial;color:#ddd5c4}button{background:#c2a66b;color:#17221c;border:0;padding:12px 20px;letter-spacing:.12em;font-weight:bold}#mobile{position:fixed;bottom:24px;left:20px;display:none;pointer-events:auto;touch-action:none}#stick{width:116px;height:116px;border:1px solid #eee7c477;border-radius:50%;background:#14241d88;position:relative}#nub{position:absolute;width:44px;height:44px;border-radius:50%;background:#d5c08c99;left:35px;top:35px}#interact{position:fixed;right:25px;bottom:40px;display:none;border-radius:50%;width:72px;height:72px}@media(pointer:coarse){#mobile,#interact{display:block}#hint{bottom:155px}}
</style></head><body><div id="hud"><div id="brand">THE LOST HORIZON<small>FIRST EXPEDITION · 01</small></div><div id="objective">OBIETTIVO<strong id="goal">Trova i tre sigilli antichi</strong></div><div id="hint">WASD / FRECCE per muoverti · Trascina per ruotare · E per interagire</div><div id="panel"><h1>IL SANTUARIO SI È RISVEGLIATO</h1><p>I tre sigilli hanno riattivato il cuore dell'isola. Ma qualcosa, oltre la soglia, ha risposto.</p><button id="continue">CONTINUA L'ESPLORAZIONE</button></div></div><div id="mobile"><div id="stick"><div id="nub"></div></div></div><button id="interact">E</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bb8ad);scene.fog=new THREE.FogExp2(0x9bb8ad,0.010);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8eddf,0x45513a,2));const sun=new THREE.DirectionalLight(0xffe2b0,3);sun.position.set(-25,35,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;scene.add(sun);
const material=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r}),green=material(0x355e43),leaf=material(0x47734a),stone=material(0x827c68),dark=material(0x4d5145),gold=material(0xd6ad57,.4),water=material(0x3b9c9b,.25);
function addBox(x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
const land=new THREE.Mesh(new THREE.CylinderGeometry(43,48,5,64),material(0x637c56));land.position.y=-2.7;land.receiveShadow=true;scene.add(land);
const ground=new THREE.Mesh(new THREE.CircleGeometry(37,64),material(0x6d8457));ground.rotation.x=-Math.PI/2;ground.position.y=-.16;ground.receiveShadow=true;scene.add(ground);
const sea=new THREE.Mesh(new THREE.CylinderGeometry(50,50,1,64),water);sea.position.y=-5.4;scene.add(sea);
function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.32*s,3.3*s,7),material(0x604832));trunk.position.set(x,1.5*s,z);trunk.castShadow=true;scene.add(trunk);for(let i=0;i<4;i++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.15-i*.08)*s,1),i%2?green:leaf);crown.position.set(x+(Math.random()-.5)*.7,3.1*s+i*.35*s,z+(Math.random()-.5)*.7);crown.castShadow=true;scene.add(crown)}}
for(let i=0;i<48;i++){const a=i/48*Math.PI*2,r=26+Math.random()*10;tree(Math.cos(a)*r,Math.sin(a)*r,.75+Math.random()*.7)}
// Ancient temple and its monumental entrance
for(let z=-20;z<=-10;z+=3.3)addBox(0,.25,z,13,.5,2.7,material(0xb5a477));
for(const side of [-1,1])for(let z=-20;z<=-8;z+=3.5){addBox(side*6,.9,z,1.1,2.1,1.1,stone);addBox(side*6,2.05,z,1.55,.35,1.55,dark)}
addBox(0,1.7,-23,15,1,2,stone);addBox(0,3,-23,14,.5,2.3,dark);
for(let x=-4.5;x<=4.5;x+=3){addBox(x,2.9,-22.8,1.2,4,1.2,stone);addBox(x,5,-22.8,1.7,.4,1.7,dark)}
addBox(0,2.1,-25.4,4.2,4.2,.8,dark);const door=addBox(0,2.1,-24.9,3.3,3.8,.5,material(0x273b35));
const arch=new THREE.Mesh(new THREE.TorusGeometry(.75,.09,8,32),gold);arch.position.set(0,2.2,-24.45);scene.add(arch);
for(let i=0;i<25;i++){const a=Math.random()*Math.PI*2,r=10+Math.random()*17,o=addBox(Math.cos(a)*r,.3,Math.sin(a)*r,1+Math.random()*2,.6+Math.random()*1.2,1+Math.random()*2,i%3?stone:dark);o.rotation.y=Math.random()*3}
const altar=new THREE.Group();altar.position.set(0,0,-8);scene.add(altar);const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(2,2.4,.7,8),stone);pedestal.position.y=.35;altar.add(pedestal);const altarTop=new THREE.Mesh(new THREE.CylinderGeometry(1.65,1.8,.3,8),gold);altarTop.position.y=.85;altar.add(altarTop);const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(.8,1),new THREE.MeshStandardMaterial({color:0x80e8d5,emissive:0x207f70,emissiveIntensity:1.2}));orb.position.y=2;altar.add(orb);
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.95,5,10),material(0x344d4c));body.position.y=1.05;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),material(0xc49b76));head.position.y=1.92;head.castShadow=true;player.add(head);const pack=new THREE.Mesh(new THREE.BoxGeometry(.58,.65,.28),material(0x78583b));pack.position.set(0,1.18,.36);player.add(pack);player.position.set(0,0,12);
const sigils=[];[[-10,4],[10,-2],[0,-15]].forEach(([x,z])=>{const pl=new THREE.Mesh(new THREE.CylinderGeometry(.8,.95,.25,24),dark);pl.position.set(x,.1,z);scene.add(pl);const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.62),new THREE.MeshStandardMaterial({color:0x68d6cb,emissive:0x176f69,emissiveIntensity:.8,metalness:.2,roughness:.25}));gem.position.set(x,1.15,z);gem.castShadow=true;scene.add(gem);sigils.push({mesh:gem,base:1.15,got:false})});
let collected=0,yaw=0,pitch=.28,drag=false,lastX=0,lastY=0,keys={},stick={x:0,y:0};const hint=document.querySelector('#hint'),goal=document.querySelector('#goal'),panel=document.querySelector('#panel');
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.006;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-lastY)*.003,-.05,.75);lastX=e.clientX;lastY=e.clientY});
const stickEl=document.querySelector('#stick'),nub=document.querySelector('#nub');stickEl.addEventListener('pointerdown',e=>{stickEl.setPointerCapture(e.pointerId);moveStick(e)});stickEl.addEventListener('pointermove',e=>{if(e.buttons)moveStick(e)});stickEl.addEventListener('pointerup',()=>{stick.x=stick.y=0;nub.style.transform='translate(0,0)'});function moveStick(e){const r=stickEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),k=Math.min(1,48/(l||1));stick.x=dx*k/48;stick.y=dy*k/48;nub.style.transform=`translate(${stick.x*42}px,${stick.y*42}px)`}
document.querySelector('#interact').onclick=interact;function interact(){if(player.position.distanceTo(altar.position)<3.4){if(collected===3){door.position.y=-2;orb.material.emissiveIntensity=2;hint.textContent='IL SANTUARIO È APERTO. ENTRA E SCOPRI COSA CUSTODISCE.';panel.style.display='block'}else hint.textContent='L’altare è inattivo. Ti servono tutti e tre i sigilli.'}}
document.querySelector('#continue').onclick=()=>{panel.style.display='none';hint.textContent='La soglia è aperta. L’avventura continua…'};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),forward=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-stick.y,side=(keys.d||keys.arrowright?1:0)+(keys.a||keys.arrowleft?-1:0)+stick.x,moving=Math.hypot(forward,side)>.08;const dir=new THREE.Vector3(side,0,forward);if(moving){dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);player.position.addScaledVector(dir,dt*(keys.shift?9:5.5));player.rotation.y=Math.atan2(dir.x,dir.z)}player.position.x=THREE.MathUtils.clamp(player.position.x,-33,33);player.position.z=THREE.MathUtils.clamp(player.position.z,-32,31);const target=new THREE.Vector3(player.position.x+Math.sin(yaw)*10,player.position.y+5+pitch*7,player.position.z+Math.cos(yaw)*10);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,1.1,player.position.z);sigils.forEach((s,i)=>{s.mesh.rotation.y+=dt*.7;s.mesh.position.y=s.base+Math.sin(clock.elapsedTime*2+i)*.12;if(!s.got&&player.position.distanceTo(s.mesh.position)<1.7){s.got=true;collected++;s.mesh.visible=false;goal.textContent=collected<3?'Sigilli recuperati: '+collected+'/3':'Torna all’altare';hint.textContent='Hai trovato un sigillo antico.'}});orb.rotation.y+=dt*.5;renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
