name: Deploy THE LOST HORIZON
on:
  push:
    branches: [main]
    paths:
      - 'the-lost-horizon/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: the-lost-horizon
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq "[.artifacts[]? | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length")
            if [ "$count" -gt 0 ]; then
              echo "Artifact metadata is visible."
              exit 0
            fi
            echo "Artifact not indexed yet ($attempt/12); waiting 5 seconds..."
            sleep 5
          done
          echo "Artifact did not become visible through the GitHub API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
