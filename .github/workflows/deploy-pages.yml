name: Build and deploy GRAVITY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract game source
        run: unzip -o GRAVITY-MVP.zip -d .

      - name: Set Vite base path
        working-directory: gravity
        run: |
          cat > vite.config.ts <<'EOF'
          import { defineConfig } from 'vite';
          export default defineConfig({
            base: '/Gravity/',
            server: { host: '0.0.0.0' },
            build: { target: 'es2022' }
          });
          EOF

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gravity/package.json

      - name: Install dependencies
        working-directory: gravity
        run: npm install

      - name: Build
        working-directory: gravity
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gravity/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
